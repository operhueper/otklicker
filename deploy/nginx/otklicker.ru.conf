# =============================================================================
# nginx config for otklicker.ru (production, Hetzner CAX21, Ubuntu 24.04)
# =============================================================================
#
# DEPLOY INSTRUCTIONS (на сервере, под root):
#
#   1. Скопировать конфиг:
#        sudo cp deploy/nginx/otklicker.ru.conf /etc/nginx/sites-available/otklicker.ru
#
#   2. Включить сайт:
#        sudo ln -sf /etc/nginx/sites-available/otklicker.ru \
#                    /etc/nginx/sites-enabled/otklicker.ru
#
#   3. Создать каталоги под контент и acme-challenge (если ещё нет):
#        sudo mkdir -p /var/www/otklicker.ru /var/www/letsencrypt
#        sudo chown -R www-data:www-data /var/www/otklicker.ru /var/www/letsencrypt
#
#   4. Проверить синтаксис и перезагрузить nginx (сначала только HTTP):
#        sudo nginx -t && sudo systemctl reload nginx
#
#   5. Получить сертификат через certbot (он автоматически раскомментит
#      ssl_certificate* директивы и активирует HTTPS-блок):
#        sudo certbot --nginx \
#             -d otklicker.ru -d www.otklicker.ru \
#             -m info@otklicker.ru --agree-tos --non-interactive --redirect
#
#   6. Проверить автообновление:
#        sudo certbot renew --dry-run
#
#   7. После того как первый certbot renew --dry-run прошёл без ошибок,
#      раскомментить директиву add_header Strict-Transport-Security ниже.
#
# Перевыпуск:
#        sudo certbot renew --force-renewal
#
# Откат на временную заглушку: оставить только server-блок 80, удалить 443.
#
# =============================================================================

# ---- HTTP (80) ---------------------------------------------------------------
# Слушает 80 для acme-challenge и редиректа на HTTPS.
server {
    listen      80;
    listen      [::]:80;
    server_name otklicker.ru www.otklicker.ru;

    server_tokens off;

    # Webroot для certbot --webroot и автоматических renew.
    # Не редиректим acme-challenge на HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Всё остальное -- 301 на HTTPS apex.
    location / {
        return 301 https://otklicker.ru$request_uri;
    }
}

# ---- HTTPS apex (443) --------------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name otklicker.ru;

    server_tokens off;

    root  /var/www/otklicker.ru;
    index index.html;

    # ---- SSL (paths активированы после certbot certonly) --------------------
    ssl_certificate     /etc/letsencrypt/live/otklicker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otklicker.ru/privkey.pem;

    # ---- TLS-параметры ------------------------------------------------------
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ---- Security headers ---------------------------------------------------
    # HSTS активирован 2026-04-25 после certbot renew --dry-run зелёного.
    # max-age 2 года, includeSubDomains, preload (готов к hstspreload.org submission).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    add_header X-Frame-Options          "DENY" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # ---- Logs ---------------------------------------------------------------
    access_log /var/log/nginx/otklicker.ru.access.log;
    error_log  /var/log/nginx/otklicker.ru.error.log warn;

    # ---- Compression --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli -- активировать если установлен пакет `libnginx-mod-http-brotli-static`
    # и `libnginx-mod-http-brotli-filter` через apt, и в /etc/nginx/nginx.conf
    # есть `load_module` для них. Пока закомменчено.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;
    # brotli_types
    #     text/plain text/css application/javascript application/json
    #     image/svg+xml application/xml font/woff font/woff2;

    # ---- ACME-challenge (на случай renew по 80 -> 443) ----------------------
    location ^~ /.well-known/acme-challenge/ {
        alias /var/www/letsencrypt/.well-known/acme-challenge/;
        default_type "text/plain";
        try_files $uri =404;
    }

    # ---- Static assets с длинным кешем --------------------------------------
    # Next.js export кладёт chunks в /_next/static/, а дополнительный статик --
    # в /static/ (если используется). Hash в именах -> immutable.
    location ~* ^/_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* ^/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Картинки и шрифты с длинным кешем (содержимое стабильное за сессию).
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
        try_files $uri =404;
    }

    # robots / sitemap -- средний кеш.
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ---- HTML и всё остальное -----------------------------------------------
    # Короткий кеш для HTML (страницы могут обновляться при деплое).
    # try_files подхватывает Next.js export варианты:
    #   /privacy           -> /privacy/index.html
    #   /privacy/          -> /privacy/index.html
    #   /privacy.html      -> /privacy.html
    location / {
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        # Заголовки безопасности должны повториться, т.к. add_header
        # не наследуется при переопределении в location.
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options          "DENY" always;
        add_header X-Content-Type-Options   "nosniff" always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

        try_files $uri $uri/ $uri.html =404;
    }

    # ---- Error pages --------------------------------------------------------
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Запретить доступ к скрытым файлам (.git, .env и т.п.), если что-то
    # случайно попало в out/.
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# ---- HTTPS www -> apex (301) -------------------------------------------------
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name www.otklicker.ru;

    server_tokens off;

    # ---- SSL (paths активированы после certbot certonly) --------------------
    ssl_certificate     /etc/letsencrypt/live/otklicker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otklicker.ru/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    return 301 https://otklicker.ru$request_uri;
}
