# =============================================================================
# nginx bootstrap config for otklicker.ru
# HTTP-only — используется до получения TLS-сертификата от certbot.
#
# Phase 7 (после переключения DNS):
#   sudo certbot --nginx -d otklicker.ru -d www.otklicker.ru \
#        -m info@otklicker.ru --agree-tos --non-interactive --redirect
# После certbot заменить этот конфиг на otklicker.ru.conf.
# =============================================================================

server {
    listen      80;
    listen      [::]:80;
    server_name otklicker.ru www.otklicker.ru;

    server_tokens off;

    root  /var/www/otklicker.ru;
    index index.html;

    # ACME challenge — критично для Phase 7 certbot
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # static export Next.js
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff font/woff2;

    # security headers (минимум, без HSTS до HTTPS)
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # logs
    access_log /var/log/nginx/otklicker.ru.access.log;
    error_log  /var/log/nginx/otklicker.ru.error.log warn;

    # error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # запретить скрытые файлы
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
