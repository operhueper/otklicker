[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marketing-engine"
version = "0.1.0"
description = "Autonomous marketing engine for Своя база Telegram channel"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.0",
    "telethon>=1.36",
    "apscheduler>=3.10",
    "pillow>=10.0",
    "aiohttp>=3.9",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
